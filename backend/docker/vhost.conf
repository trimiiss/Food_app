# Apache vhost for the Laravel API. The port is rewritten to $PORT at boot by
# docker/entrypoint.sh — Render decides which port the service listens on.
<VirtualHost *:80>
    # Render terminates TLS in front of us; this only silences Apache's
    # "could not reliably determine the server's FQDN" warning at boot.
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Render collects the container's stdout/stderr as the service's logs.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
